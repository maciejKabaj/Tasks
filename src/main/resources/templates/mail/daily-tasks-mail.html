<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width">
    <meta charset="UTF-8">
    <title>Daily Task Summary</title>
</head>

<body style="background-color: #f6f6f6; font-family: sans-serif; margin: 0; padding: 0;">

<table border="0" cellpadding="0" cellspacing="0" style="width: 100%; background-color: #f6f6f6;">
    <tr>
        <td></td>

        <td style="max-width: 580px; margin: 0 auto; padding: 10px;">
            <div style="background: #ffffff; border-radius: 3px; padding: 20px;">

                <!-- WELCOME IF/ELSE -->
                <p th:if="${is_friend}" style="font-size: 14px; margin: 0 0 15px;">
                    Hey <span th:text="${admin_config.adminName}"></span>!
                </p>

                <p th:unless="${is_friend}" style="font-size: 14px; margin: 0 0 15px;">
                    Dear <span th:text="${admin_config.adminName}"></span>,
                </p>

                <!-- MAIN MESSAGE -->
                <p style="margin-bottom: 15px;" th:text="${message}"></p>

                <!-- TASK COUNT -->
                <p style="margin-bottom: 15px; font-size: 14px;">
                    You currently have <strong th:text="${task_count}"></strong> tasks in your database.
                </p>

                <!-- MOTIVATION LIST (pętla) -->
                <p style="font-size: 14px;">Today's motivation:</p>
                <ul th:each="m : ${motivation_list}">
                    <li th:text="${m}"></li>
                </ul>

                <!-- BUTTON -->
                <div style="margin: 20px 0;">
                    <table th:if="${show_button}">
                        <tr>
                            <td style="background-color: #3498db; border-radius: 5px; text-align: center;">
                                <a th:href="${tasks_url}"
                                   th:text="${button}"
                                   style="display: inline-block; padding: 12px 25px; color: #ffffff; background: #3498db; text-decoration: none; border-radius: 5px;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </div>

                <!-- GOODBYE -->
                <p style="margin-bottom: 15px;" th:text="${goodbye_message}"></p>

                <!-- FOOTER -->
                <p style="font-size: 12px; color: #999999; text-align: center;"
                   th:text="${company_details}"></p>

            </div>
        </td>

        <td></td>
    </tr>
</table>

</body>
</html>
