<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Trello Card</title>
  <style>

    @media only screen and (max-width: 620px) {
      table[class=body] h1 {
        font-size: 28px !important;
        margin-bottom: 10px !important;
      }
      table[class=body] p,
      table[class=body] ul,
      table[class=body] ol,
      table[class=body] td,
      table[class=body] span,
      table[class=body] a {
        font-size: 16px !important;
      }
      table[class=body] .wrapper,
      table[class=body] .article {
        padding: 10px !important;
      }
      table[class=body] .content {
        padding: 0 !important;
      }
      table[class=body] .container {
        padding: 0 !important;
        width: 100% !important;
      }
      table[class=body] .main {
        border-left-width: 0 !important;
        border-radius: 0 !important;
        border-right-width: 0 !important;
      }
      table[class=body] .btn table {
        width: 100% !important;
      }
      table[class=body] .btn a {
        width: 100% !important;
      }
      table[class=body] .img-responsive {
        height: auto !important;
        max-width: 100% !important;
        width: auto !important;
      }
    }

    @media all {
      .ExternalClass { width: 100%; }
      .ExternalClass,
      .ExternalClass p,
      .ExternalClass span,
      .ExternalClass font,
      .ExternalClass td,
      .ExternalClass div {
        line-height: 100%;
      }
      .apple-link a {
        color: inherit !important;
        font-family: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
        text-decoration: none !important;
      }
      .btn-primary table td:hover {
        background-color: #34495e !important;
      }
      .btn-primary a:hover {
        background-color: #34495e !important;
        border-color: #34495e !important;
      }
    }
  </style>
</head>

<body style="background-color: #f6f6f6; font-family: sans-serif; font-size: 14px; line-height: 1.4; margin: 0; padding: 0;">
<table border="0" cellpadding="0" cellspacing="0" class="body" style="width: 100%; background-color: #f6f6f6;">
  <tr>
    <td></td>
    <td class="container" style="display: block; Margin: 0 auto; max-width: 580px; padding: 10px;">
      <div class="content" style="max-width: 580px; padding: 10px;">

        <!-- START CENTERED WHITE CONTAINER -->
        <span class="preheader"
              style="color: transparent; display: none;">PREVIEW_MESSAGE</span>

        <table class="main" style="width: 100%; background: #ffffff; border-radius: 3px;">

          <!-- START MAIN CONTENT AREA -->
          <tr>
            <td class="wrapper" style="padding: 20px;">
              <table border="0" cellpadding="0" cellspacing="0" style="width: 100%;">
                <tr>
                  <td>

                    <!-- WELCOME MESSAGE -->
                    <p style="margin: 0 0 15px;">
                      <span th:text="${welcome_message}">WELCOME_MESSAGE</span>
                      <span th:text="${admin_name}"></span>
                    </p>

                    <!-- MAIN MESSAGE -->
                    <p style="margin: 0 0 15px;" th:text="${message}"></p>

                    <!-- BUTTON -->
                    <table border="0" cellpadding="0" cellspacing="0" class="btn btn-primary" style="width: 100%;">
                      <tbody>
                      <tr>
                        <td align="left" style="padding-bottom: 15px;">
                          <table border="0" cellpadding="0" cellspacing="0" style="width: auto;">
                            <tbody>
                            <tr>
                              <td style="background-color: #3498db; border-radius: 5px; text-align: center;">
                                <a th:href="${tasks_url}"
                                   th:text="${button}"
                                   target="_blank"
                                   style="display: inline-block; color: #ffffff; background-color: #3498db; border: solid 1px #3498db; border-radius: 5px; padding: 12px 25px; text-decoration: none;">
                                </a>
                              </td>
                            </tr>
                            </tbody>
                          </table>
                        </td>
                      </tr>
                      </tbody>
                    </table>

                    <!-- GOODBYE MESSAGE -->
                    <p style="margin: 0 0 15px;" th:text="${goodbye_message}">GOODBYE_MESSAGE</p>

                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- END MAIN CONTENT AREA -->

        </table>

        <!-- START FOOTER -->
        <div class="footer" style="Margin-top: 10px; text-align: center; width: 100%;">
          <table border="0" cellpadding="0" cellspacing="0" style="width: 100%;">
            <tr>
              <td class="content-block" style="padding: 10px; font-size: 12px; color: #999999;">
                <span class="apple-link" th:text="${company_details}">COMPANY_DETAILS</span>
              </td>
            </tr>
          </table>
        </div>
        <!-- END FOOTER -->

        <!-- END CENTERED WHITE CONTAINER -->
      </div>
    </td>
    <td></td>
  </tr>
</table>
</body>
</html>
